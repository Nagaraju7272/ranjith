- name: Deploy on EC2
  uses: appleboy/ssh-action@v0.1.10
  with:
    host: ${{ secrets.EC2_HOST }}
    username: ${{ secrets.EC2_USER }}
    key: ${{ secrets.SSH_PRIVATE_KEY }}
    port: ${{ secrets.EC2_PORT || '22' }}
    script: |
      set -euo pipefail

      export HOME="/home/${{ secrets.EC2_USER }}"
      export PM2_HOME="$HOME/.pm2"
      mkdir -p "$HOME/deploy-this"

      echo "Checking remote home directory..."
      ls -la "$HOME"

      echo "Cleaning old deployment folder only..."
      rm -rf "$HOME/deploy-this"

      echo "Looking for uploaded archive..."
      ls -la "$HOME" | grep "deploy-.*tar.gz" || true

      echo "Extracting artifact..."
      if [ ! -f "$HOME/deploy-${{ github.run_id }}.tar.gz" ]; then
        echo "ERROR: artifact not found!"
        ls -la "$HOME"
        exit 1
      fi

      tar -xzf "$HOME/deploy-${{ github.run_id }}.tar.gz" -C "$HOME/deploy-this"

      # Install Node if missing
      if ! command -v node >/dev/null 2>&1; then
        curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
        sudo apt-get update
        sudo apt-get install -y nodejs
      fi

      # Install PM2 if missing
      if ! command -v pm2 >/dev/null 2>&1; then
        sudo npm install -g pm2
      fi

      echo "Freeing port 5000..."
      sudo fuser -k 5000/tcp || true

      pm2 delete deploy-this || true

      cd "$HOME/deploy-this/server"
      npm ci --production

      echo "Starting app..."
      PORT=5000 NODE_ENV=production pm2 start index.js --name deploy-this

      pm2 save
      sudo env PATH="$PATH" PM2_HOME="$PM2_HOME" pm2 startup systemd -u ${{ secrets.EC2_USER }} --hp "$HOME" || true

      echo "PM2 status:"
      pm2 list