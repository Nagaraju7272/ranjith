name: Build and Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install & Build Client
        working-directory: ./client
        run: |
          npm ci
          npm run build

      - name: Prepare artifact
        run: |
          tar -czf deploy-${{ github.run_id }}.tar.gz server/ client/dist/

      # ✅ CLEANUP BEFORE SCP (fixes your error)
      - name: Cleanup old files on EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.EC2_PORT || '22' }}
          script: |
            rm -rf ~/deploy-*.tar.gz
            rm -rf ~/deploy-this

      - name: Copy artifact to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.EC2_PORT || '22' }}
          source: "deploy-${{ github.run_id }}.tar.gz"
          target: "/home/${{ secrets.EC2_USER }}/"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.EC2_PORT || '22' }}
          script: |
            set -euo pipefail

            export HOME="/home/${{ secrets.EC2_USER }}"
            export PM2_HOME="$HOME/.pm2"
            mkdir -p "$HOME" "$PM2_HOME" "$HOME/deploy-this"

            echo "Checking remote home directory..."
            ls -la "$HOME"

            echo "Cleaning old deployment state..."
            rm -rf "$HOME/deploy-this"
            rm -f "$HOME/deploy-"*.tar.gz

            echo "Looking for uploaded archive..."
            ls -la "$HOME" | grep "deploy-.*tar.gz" || true

            echo "Extracting artifact..."
            if [ ! -f "$HOME/deploy-${{ github.run_id }}.tar.gz" ]; then
              echo "ERROR: artifact not found on remote host: $HOME/deploy-${{ github.run_id }}.tar.gz"
              find "$HOME" -maxdepth 1 -type f -name '*.tar.gz' -ls || true
              exit 1
            fi
            tar -xzf "$HOME/deploy-${{ github.run_id }}.tar.gz" -C "$HOME/deploy-this"

            if ! command -v node >/dev/null 2>&1; then
              curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
              sudo apt-get update
              sudo apt-get install -y nodejs
            fi

            if ! command -v pm2 >/dev/null 2>&1; then
              sudo npm install -g pm2
            fi

            echo "Ensuring app port is free..."
            if command -v fuser >/dev/null 2>&1; then
              sudo fuser -k 5000/tcp || true
            fi

            if pm2 describe deploy-this >/dev/null 2>&1; then
              pm2 delete deploy-this || true
            fi

            cd "$HOME/deploy-this/server"
            npm ci --production

            echo "Starting app directly via PM2..."
            PORT=5000 NODE_ENV=production pm2 start index.js --name deploy-this --cwd "$HOME/deploy-this/server" --watch false

            pm2 save
            sudo env PATH="$PATH" PM2_HOME="$PM2_HOME" pm2 startup systemd -u ${{ secrets.EC2_USER }} --hp "$HOME" || true

            echo "PM2 status:"
            pm2 list
            echo "Deployment successful!"