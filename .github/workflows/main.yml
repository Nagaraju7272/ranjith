name: Build and Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install & Build Client
        working-directory: ./client
        run: |
          npm ci
          npm run build

      - name: Prepare artifact
        run: |
          tar -czf deploy-${{ github.run_id }}.tar.gz server/ client/dist/

      # ✅ Clean ONLY old folders (NOT tar file)
      - name: Cleanup old deployment folder on EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.EC2_PORT || '22' }}
          script: |
            rm -rf ~/deploy-this

      - name: Copy artifact to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.EC2_PORT || '22' }}
          source: "deploy-${{ github.run_id }}.tar.gz"
          target: "~/"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.EC2_PORT || '22' }}
          script: |
            set -e

            echo "📁 Checking files in home directory"
            ls -la ~

            echo "📦 Creating deployment folder"
            mkdir -p ~/deploy-this

            echo "📦 Extracting artifact"
            if [ ! -f ~/deploy-${{ github.run_id }}.tar.gz ]; then
              echo "❌ ERROR: Artifact not found!"
              exit 1
            fi

            tar -xzf ~/deploy-${{ github.run_id }}.tar.gz -C ~/deploy-this

            # Install Node if not installed
            if ! command -v node >/dev/null 2>&1; then
              curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
              sudo apt-get update
              sudo apt-get install -y nodejs
            fi

            # Install PM2 if not installed
            if ! command -v pm2 >/dev/null 2>&1; then
              sudo npm install -g pm2
            fi

            echo "🧹 Freeing port 5000"
            sudo fuser -k 5000/tcp || true

            echo "🔄 Restarting app"
            pm2 delete deploy-this || true

            cd ~/deploy-this/server
            npm ci --production

            PORT=5000 NODE_ENV=production pm2 start index.js --name deploy-this

            pm2 save
            sudo pm2 startup systemd -u $USER --hp $HOME || true

            echo "📊 PM2 Status"
            pm2 list

            echo "✅ Deployment completed successfully!"