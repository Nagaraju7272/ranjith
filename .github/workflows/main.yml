name: Build and Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install & Build Client
        working-directory: ./client
        run: |
          npm ci
          npm run build

      - name: Prepare artifact
        run: |
          tar -czf deploy-${{ github.run_id }}.tar.gz server/ client/dist/

      # ✅ CLEANUP BEFORE SCP (fixes your error)
      - name: Cleanup old files on EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.EC2_PORT || '22' }}
          script: |
            rm -rf ~/deploy-*.tar.gz
            rm -rf ~/deploy-this

      - name: Copy artifact to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.EC2_PORT || '22' }}
          source: "deploy-${{ github.run_id }}.tar.gz"
          target: "~/"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.EC2_PORT || '22' }}
          script: |
            set -e

            export HOME="${HOME:-/home/${USER:-ubuntu}}"
            mkdir -p "$HOME"
            cd "$HOME"

            mkdir -p "$HOME/deploy-this"

            echo "Extracting artifact..."
            tar -xzf "$HOME/deploy-${{ github.run_id }}.tar.gz" -C "$HOME/deploy-this"

            # Install Node if missing
            if ! command -v node >/dev/null 2>&1; then
              curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
              sudo apt-get update
              sudo apt-get install -y nodejs
            fi

            # Install PM2 if missing
            if ! command -v pm2 >/dev/null 2>&1; then
              sudo npm install -g pm2
            fi

            echo "Serving frontend via Express (no nginx)"

            # Ensure no stale process is holding the app port
            if command -v fuser >/dev/null 2>&1; then
              sudo fuser -k 5000/tcp || true
            fi

            # Remove stale PM2 app state before start
            if pm2 describe deploy-this >/dev/null 2>&1; then
              pm2 delete deploy-this || true
            fi

            # Install dependencies from a guaranteed-valid working directory
            cd "$HOME/deploy-this/server"
            npm ci --production

            # Start with explicit working directory to avoid pm2 uv_cwd errors
            PORT=5000 pm2 start index.js --name deploy-this --cwd "$HOME/deploy-this/server" --watch false

            pm2 save
            sudo pm2 startup systemd -u $USER --hp $HOME || true

            echo "PM2 process list:"
            pm2 list

            echo "Last app logs:"
            pm2 logs deploy-this --lines 50 --nostream || true

            echo "Deployment successful!"