name: Build and Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install & Build Client
        working-directory: ./client
        run: |
          npm ci
          npm run build

      - name: Prepare artifact
        run: |
          tar -czf deploy-${{ github.run_id }}.tar.gz server/ client/dist/

      # ✅ CLEANUP BEFORE SCP (fixes your error)
      - name: Cleanup old files on EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.EC2_PORT || '22' }}
          script: |
            rm -rf ~/deploy-*.tar.gz
            rm -rf ~/deploy-this

      - name: Copy artifact to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.EC2_PORT || '22' }}
          source: "deploy-${{ github.run_id }}.tar.gz"
          target: "~/"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.EC2_PORT || '22' }}
          script: |
            set -e

            mkdir -p ~/deploy-this

            echo "Extracting artifact..."
            tar -xzf ~/deploy-${{ github.run_id }}.tar.gz -C ~/deploy-this

            # Install Node if missing
            if ! command -v node >/dev/null 2>&1; then
              curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
              sudo apt-get update
              sudo apt-get install -y nodejs
            fi

            # Install PM2 if missing
            if ! command -v pm2 >/dev/null 2>&1; then
              sudo npm install -g pm2
            fi

            echo "Serving frontend via Express (no nginx)"

            cd ~/deploy-this/server

            npm ci --production

            # Restart or start app
            if pm2 describe deploy-this >/dev/null 2>&1; then
              pm2 restart deploy-this
            else
              pm2 start index.js --name deploy-this
            fi

            pm2 save
            sudo pm2 startup systemd -u $USER --hp $HOME || true

            echo "Deployment successful!"